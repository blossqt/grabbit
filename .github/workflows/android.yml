name: Android APK

# Builds the phone app on a Linux runner, so no machine here needs a
# hypervisor switched on to produce one. The steps are the same scripts a
# person would run locally, in the same order.

on:
  workflow_dispatch:
    inputs:
      rebuild_natives:
        description: 'Recompile aria2, FFmpeg, QuickJS and dav1d instead of reusing the cache'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/grabbit/**'
      - 'build/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  # Written twice each - once to restore, once to save - so they live here
  # rather than being repeated four lines apart and drifting.
  TOOLCHAIN_KEY: android-toolchain-v1
  NATIVES_KEY: android-natives-v1
  P4A_KEY: android-p4a-v1
  DEBUGKEY_KEY: android-debug-keystore-v1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    # The runner ships its own Android SDK under /usr/local/lib/android and
    # points these at it. We delete that SDK below to make room, and the build
    # scripts honour whatever ANDROID_HOME says - so say our own directory,
    # which is also what the caches are keyed to. The NDK variables are
    # emptied rather than set: every script falls back to finding the NDK
    # itself, and an inherited path to a deleted one is worse than none.
    env:
      ANDROID_HOME: /home/runner/android
      ANDROID_SDK_ROOT: /home/runner/android
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      ANDROID_NDK: ''
      ANDROID_NDK_LATEST_HOME: ''
      # Where Gradle keeps its debug signing key. This is its documented
      # default spelled out, because the default alone left the key somewhere
      # the cache below never found.
      ANDROID_USER_HOME: /home/runner/.android
      # Whether this repository holds the release signing key. Secrets cannot
      # appear in a step's condition, but a job's environment can carry this.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        # The NDK plus p4a's build tree need roughly 15 GB between them. The
        # image ships SDKs we do not use, but deleting them takes minutes -
        # as long as the rest of a cached build - and today's runners have
        # far more room than that to begin with, so they go only when the
        # disk is short.
        run: |
          free=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free: ${free} GB"
          if [ "$free" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
            df -h /
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'          # what Gradle 8.14 and AGP 8.11 expect

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Three caches, each restored here and written back further down as
      # soon as the thing it holds is built. Writing them back at the end
      # instead - which is what a plain cache step does - would mean a
      # failure in the last half hour threw away the first two hours too.

      # The Android SDK and NDK - ours and the ones p4a builds against - with
      # their licences: a few GB, unchanged unless fetch_sdk.sh or
      # versions.sh changes.
      - name: Restore the Android toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/android/ndk
            ~/android/android-ndk-*
            ~/android/platforms
            ~/android/build-tools
            ~/android/cmdline-tools
            ~/android/platform-tools
            ~/android/licenses
          key: ${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('build/android/fetch_sdk.sh', 'build/android/versions.sh') }}
          restore-keys: ${{ env.TOOLCHAIN_KEY }}-

      # The four binaries the APK carries. Compiling them takes a good part
      # of the run, and only these scripts and the aria2 patch change them.
      # No restore-keys: a near-miss would leave a sysroot built by different
      # scripts, and these are cheap enough to build again from nothing.
      - name: Restore the compiled tools
        id: natives
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/android
            ~/android/arm64-sysroot
          key: ${{ env.NATIVES_KEY }}-${{ hashFiles('build/android/build_aria2.sh', 'build/android/build_tools.sh', 'build/patches/*.patch') }}

      # CPython, SDL and Kivy are compiled from source the first time and
      # take most of an hour between them. Nothing in the app changes them,
      # so keep the tree p4a builds them in, under the scripts that shape it:
      # while they stay the same, every build restores the whole tree and
      # writes nothing back. When they change, the prefix finds the newest
      # tree there is, and a whole one is written for the new scripts.
      - name: Restore python-for-android's build tree
        id: p4a
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/android/p4a-venv
            ~/android/p4a-build/packages
            ~/android/p4a-build/build/other_builds
            ~/android/p4a-build/build/bootstrap_builds
            ~/android/p4a-build/dists
          key: ${{ env.P4A_KEY }}-${{ hashFiles('build/android/setup_p4a.sh', 'build/android/build_apk.sh', 'build/android/versions.sh', 'build/android/recipes/**') }}
          restore-keys: ${{ env.P4A_KEY }}-

      - name: Install what the cross-compiles need
        # Only when something will be compiled: the binaries, or p4a's build
        # tree, missing from their caches. A build from both only packs.
        #
        # autopoint and gettext are for aria2's autoreconf. libltdl-dev is for
        # p4a's libffi recipe: its configure.ac asks for LT_SYS_SYMBOL_USCORE,
        # which is not in any of the five files libtoolize copies - it is in
        # ltdl.m4, and only this package puts that where aclocal looks.
        if: >-
          steps.natives.outputs.cache-hit != 'true' || steps.p4a.outputs.cache-hit != 'true'
          || inputs.rebuild_natives
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libltdl-dev pkg-config cmake ninja-build ccache \
            gettext autopoint texinfo libncurses-dev \
            build-essential patch unzip zip curl git \
            libffi-dev libssl-dev zlib1g-dev libbz2-dev liblzma-dev libsqlite3-dev

      - name: Fetch the SDK and NDK
        id: sdk
        run: bash build/android/fetch_sdk.sh

      - name: Keep the Android toolchain
        if: always() && steps.sdk.outcome == 'success' && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/android/ndk
            ~/android/android-ndk-*
            ~/android/platforms
            ~/android/build-tools
            ~/android/cmdline-tools
            ~/android/platform-tools
            ~/android/licenses
          key: ${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('build/android/fetch_sdk.sh', 'build/android/versions.sh') }}

      - name: Cross-compile aria2
        if: steps.natives.outputs.cache-hit != 'true' || inputs.rebuild_natives
        run: bash build/android/build_aria2.sh

      - name: Cross-compile QuickJS, LAME, dav1d and FFmpeg
        if: steps.natives.outputs.cache-hit != 'true' || inputs.rebuild_natives
        run: bash build/android/build_tools.sh

      - name: Check the tools came out
        id: toolcheck
        run: |
          ls -l vendor/android
          for tool in aria2c ffmpeg ffprobe qjs; do
            test -s "vendor/android/$tool" || { echo "missing $tool"; exit 1; }
            file "vendor/android/$tool" | grep -q 'ARM aarch64' \
              || { echo "$tool is not an arm64 binary"; exit 1; }
          done

      # Only once the four binaries have been looked at, so a half-finished
      # sysroot is never written back under a key that claims to be whole.
      - name: Keep the compiled tools
        if: always() && steps.toolcheck.outcome == 'success' && steps.natives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/android
            ~/android/arm64-sysroot
          key: ${{ env.NATIVES_KEY }}-${{ hashFiles('build/android/build_aria2.sh', 'build/android/build_tools.sh', 'build/patches/*.patch') }}

      # Android installs an APK over an earlier one only when both are signed
      # with the same key, so every build is signed with the one release key
      # (build/android/make_signing_key.py made it and stored it as a secret).
      # Gradle signs debug builds with whatever sits at ANDROID_USER_HOME's
      # debug.keystore, so that is where it goes.
      - name: Install the release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"

      # A fork has no release key, and builds with a throwaway one instead -
      # kept between its runs so at least its own builds update each other.
      # The release key itself is never cached: a cache can be read by more
      # than this workflow, and a secret cannot.
      - name: Restore a throwaway signing key
        if: env.HAS_RELEASE_KEY != 'true'
        id: debugkey
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.DEBUGKEY_KEY }}

      - name: Make the signing key if there is none
        id: keystore
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          sha=$(keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android \
                | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "signing key SHA-256: $sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Keep the throwaway signing key
        if: env.HAS_RELEASE_KEY != 'true' && steps.debugkey.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ env.DEBUGKEY_KEY }}

      - name: Set up python-for-android
        id: p4asetup
        run: bash build/android/setup_p4a.sh

      - name: Build the APK
        id: build
        run: bash build/android/build_apk.sh

      # Written back only when it was not restored whole, and under the
      # scripts' key only once an APK came out of it: an entry cannot be
      # replaced, so a half-built tree there would be restored, and rebuilt,
      # by every run until the scripts next change. A failed build still
      # keeps what it compiled - CPython, SDL and Kivy, which this app cannot
      # break and p4a finishes by itself - under a name of its own, which
      # the prefix finds next time.
      - name: Keep python-for-android's build tree
        if: steps.build.outcome == 'success' && steps.p4a.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/android/p4a-venv
            ~/android/p4a-build/packages
            ~/android/p4a-build/build/other_builds
            ~/android/p4a-build/build/bootstrap_builds
            ~/android/p4a-build/dists
          key: ${{ env.P4A_KEY }}-${{ hashFiles('build/android/setup_p4a.sh', 'build/android/build_apk.sh', 'build/android/versions.sh', 'build/android/recipes/**') }}

      - name: Keep what a failed build compiled
        if: failure() && steps.p4asetup.outcome == 'success' && steps.p4a.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/android/p4a-venv
            ~/android/p4a-build/packages
            ~/android/p4a-build/build/other_builds
            ~/android/p4a-build/build/bootstrap_builds
            ~/android/p4a-build/dists
          key: ${{ env.P4A_KEY }}-partial-${{ github.run_id }}

      - name: Name it after the commit
        id: apk
        run: |
          built=$(ls dist/android/grabbit-debug-*.apk | head -1)
          # The whole point of keeping the key is that the next APK installs
          # over this one, and that only holds if Gradle actually signed with
          # it. Look, rather than trust that it did.
          signer=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$built" \
                   | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          echo "APK signed by SHA-256: $signer"
          if [ "$signer" != "${{ steps.keystore.outputs.sha256 }}" ]; then
            echo "::error::the APK is not signed with the key installed for it, so it will not install over the last one"
            exit 1
          fi
          # And that key must be the one the repository pins. A secret that
          # has been replaced would otherwise produce APKs that build and
          # install cleanly - on a phone that never had Grabbit.
          pinned=$(tr -d '[:space:]' < build/android/signing-sha256.txt)
          if [ "$HAS_RELEASE_KEY" = 'true' ] && [ "$signer" != "$pinned" ]; then
            echo "::error::the ANDROID_KEYSTORE_B64 secret is not the key build/android/signing-sha256.txt pins"
            exit 1
          fi
          if [ "$signer" != "$pinned" ]; then
            echo "::warning::signed with a throwaway key: this APK cannot be released or installed over Grabbit"
          fi
          version=$(sed -n "s/^APP_VERSION = '\(.*\)'/\1/p" app/grabbit/__init__.py)
          final="dist/android/Grabbit-${version}-arm64-${GITHUB_SHA::7}.apk"
          mv "$built" "$final"
          sha256sum "$final" | tee "$final.sha256"
          echo "path=$final" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$final")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
